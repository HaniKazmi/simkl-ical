services:
  simkl-ical:
    # Built and published by GitHub Actions. Deliberately no `build:` key — with
    # both present Compose tries to build when the image is missing locally,
    # which fails on a host that has no source checkout.
    image: ghcr.io/hanikazmi/simkl-ical:latest
    container_name: simkl-ical
    restart: unless-stopped
    environment:
      SIMKL_CLIENT_ID: ${SIMKL_CLIENT_ID:?set in .env}
      FEED_TOKEN: ${FEED_TOKEN:?set in .env}
      # Set explicitly. A container that inherits nothing defaults to UTC and
      # produces a feed that is off by one day for late-evening US airings.
      TZ: ${TZ:-Europe/London}
      RELEASE_COUNTRY: ${RELEASE_COUNTRY:-GB}
      GRACE_DAYS: ${GRACE_DAYS:-14}
    volumes:
      - simkl-ical-data:/data
    ports:
      # Behind a reverse proxy, drop this and put the container on the proxy's
      # network instead — see the README.
      - "${HOST_PORT:-3000}:3000"

volumes:
  simkl-ical-data:
