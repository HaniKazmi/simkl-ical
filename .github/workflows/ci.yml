name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN is enough for GHCR; no personal access token needed.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build into the local daemon first. Smoke testing before publishing means
      # a broken image never reaches the registry.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually runs. /healthz answers 503 without a token —
      # nothing has been rendered yet — so the assertion is that it responds at
      # all with parseable JSON, not that it reports healthy.
      - name: Smoke test
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name smoke -p 3000:3000 \
            -e SIMKL_CLIENT_ID=smoke-test \
            -e FEED_TOKEN=smoke-test-token \
            -e TZ=Europe/London \
            "$IMAGE"

          # curl writes 000 via -w AND exits non-zero when the connection is
          # refused, so `$(curl ... || echo 000)` would concatenate to "000000"
          # and break the loop on the first pass. Assign, then test.
          CODE=000
          for _ in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz) || CODE=000
            case "$CODE" in 200|503) break ;; esac
            sleep 1
          done

          BODY=$(curl -s http://localhost:3000/healthz)
          echo "HTTP $CODE"
          echo "$BODY"

          # Unauthenticated is 503 by design; anything else means it did not boot.
          if [ "$CODE" != "200" ] && [ "$CODE" != "503" ]; then
            echo "::error::unexpected /healthz status $CODE"
            exit 1
          fi

          echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('parsed ok, timezone =', d['timezone'])"

          # The feed route must exist and reject a wrong token.
          WRONG=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/nope/feed.ics)
          [ "$WRONG" = "404" ] || { echo "::error::expected 404 for a wrong token, got $WRONG"; exit 1; }

          echo "smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs smoke 2>&1 || true

      - name: Clean up
        if: always()
        run: docker rm -f smoke || true

      # Only now, with the image proven to run. Cache makes this near-instant.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
